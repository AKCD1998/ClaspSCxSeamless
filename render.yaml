services:
  - type: web
    name: claspscxseamless-web
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm install && npm run build
    startCommand: npm run db:migrate && npm run db:seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SC_OFFICIAL_SUPABASE_DATABASE_URL
        sync: false
      - key: SEAMLESS_DB_SCHEMA
        value: clasp_scx_seamless
      - key: INTERNAL_API_TOKEN
        generateValue: true
      - key: STORAGE_DIR
        value: storage
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
